<style>
  /* iletisim-damga — Ailede DAMGA dili olan tek modül: border + outline-offset çift çerçeve, iç ::after kesikli halka, çapraz çizgili mürekkep dokusu ve gözlemle (IntersectionObserver) scale(1.6) → 1 «vurma» hareketi; kartpostal'daki tek süs damgadan farklı olarak kanalların kendisi damgadır. */
  .modulex-iletisim-damga { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-iletisim-damga *, .modulex-iletisim-damga *::before, .modulex-iletisim-damga *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-iletisim-damga :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-iletisim-damga :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-iletisim-damga :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-iletisim-damga :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-damga img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-iletisim-damga) img { height: auto; }
  .modulex-iletisim-damga [hidden] { display: none !important; }
  .modulex-iletisim-damga :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-iletisim-damga :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-iletisim-damga-ic { max-width: --max--; margin-inline: auto; }
  .modulex-iletisim-damga-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }

  .modulex-iletisim-damga-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-iletisim-damga-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-iletisim-damga-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }

  .modulex-iletisim-damga-masa3 { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(28px, 5vw, 72px); align-items: center; }
  .modulex-iletisim-damga-dbas { display: grid; gap: 16px; min-width: 0; }
  .modulex-iletisim-damga-muhur3 { justify-self: start; margin-block-start: 12px; padding: 10px 22px; border: 4px solid --accentInk--; outline: 2px solid --accentInk--; outline-offset: 4px; border-radius: 8px; color: --accentInk--; font-family: var(--mx-font-heading, inherit); font-size: clamp(1.2rem, 2.4vw, 1.7rem); font-weight: 900; letter-spacing: 0.16em; text-transform: uppercase; transform: rotate(-7deg); transition: transform 0.4s ease; }
  .modulex-iletisim-damga-dbas:hover .modulex-iletisim-damga-muhur3 { transform: rotate(-2deg) scale(1.04); }
  .modulex-iletisim-damga-damgalar { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: clamp(20px, 3vw, 34px); padding: 12px; }
  .modulex-iletisim-damga-damga2 { --r: -2.5deg; position: relative; display: grid; min-width: 0; padding: 8px; border: 3px solid --accentInk--; outline: 1.5px solid --accentInk--; outline-offset: 5px; border-radius: 14px; color: --accentInk--; background-image: repeating-linear-gradient(115deg, color-mix(in srgb, --accentInk-- 6%, transparent) 0 2px, transparent 2px 7px); transform: rotate(var(--r)); transition: transform 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2), opacity 0.3s ease; }
  .modulex-iletisim-damga-damga2:nth-child(even) { --r: 2deg; border-radius: 40px; }
  .modulex-iletisim-damga-damga2:nth-child(3n) { --r: -1deg; }
  .modulex-iletisim-damga-damga2:hover { transform: rotate(0) scale(1.03); }
  .modulex-iletisim-damga--hazir:not(.modulex-iletisim-damga--gor) .modulex-iletisim-damga-damga2 { opacity: 0; transform: rotate(var(--r)) scale(1.6); }
  .modulex-iletisim-damga--gor .modulex-iletisim-damga-damga2 { transition-delay: calc(var(--i, 0) * 140ms); }
  .modulex-iletisim-damga-dic { position: relative; display: grid; justify-items: center; gap: 6px; padding: 18px 14px; text-align: center; }
  .modulex-iletisim-damga-dic::after { content: ""; position: absolute; inset: 0; border: 1.5px dashed color-mix(in srgb, --accentInk-- 55%, transparent); border-radius: inherit; pointer-events: none; }
  .modulex-iletisim-damga-damga2:nth-child(even) .modulex-iletisim-damga-dic { border-radius: 32px; }
  .modulex-iletisim-damga-damga2:not(:nth-child(even)) .modulex-iletisim-damga-dic { border-radius: 8px; }
  .modulex-iletisim-damga-dik { font-size: 30px; }
  .modulex-iletisim-damga-detk { font-size: 0.78rem; font-weight: 900; letter-spacing: 0.2em; text-transform: uppercase; }
  .modulex-iletisim-damga-ddeg { color: --text--; font-weight: 800; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-damga-ddeg:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  @media (max-width: 1024px) {
    .modulex-iletisim-damga-masa3 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 768px) {
    .modulex-iletisim-damga-damgalar { padding: 8px 4px; }
    .modulex-iletisim-damga-damga2, .modulex-iletisim-damga-damga2:nth-child(even), .modulex-iletisim-damga-damga2:nth-child(3n) { --r: 0deg; }
  }
  .modulex-iletisim-damga-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-damga-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-damga-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-damga-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-damga-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-damga-eylem:hover { gap: 10px; }
  .modulex-iletisim-damga-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-damga-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-damga--kjs .modulex-iletisim-damga-kopya { display: inline-flex; }
  .modulex-iletisim-damga-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-damga-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-damga--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-damga-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-damga-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-damga-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-damga-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-damga-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-damga-cikon { font-size: 18px; }
  .modulex-iletisim-damga-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-damga-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-damga-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-damga-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-damga-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-damga-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-damga-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-damga-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-damga-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-damga :is(.modulex-iletisim-damga-baslik, .modulex-iletisim-damga-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-damga-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-damga { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-damga *, .modulex-iletisim-damga *::before, .modulex-iletisim-damga *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-damga";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
